{% extends 'base.html' %}

{% block title %}Delete {{ label }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white"><h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Delete {{ label }}</h4></div>
            <div class="card-body">
                <p class="alert alert-warning">Delete “{{ object }}”? This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url urls.list %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-2"></i>Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
