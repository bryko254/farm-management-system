name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: farm, POSTGRES_USER: farm, POSTGRES_PASSWORD: farm}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farm" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgres://farm:farm@localhost:5432/farm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
        env:
          DJANGO_SECURE_SSL: 'False'  # test client speaks plain HTTP
