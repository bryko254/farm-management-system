{% extends 'base.html' %}

{% block title %}Delete Crop - {{ crop.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-danger text-white"><h4 class="mb-0">Delete Crop</h4></div>
            <div class="card-body">
                <p class="lead">Are you sure you want to delete “{{ crop.name }} ({{ crop.variety }})”?</p>
                <p class="text-danger"><i class="fas fa-exclamation-triangle"></i> This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Confirm Delete</button>
                        <a href="{% url 'crop_management:crop_detail' pk=crop.pk %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
