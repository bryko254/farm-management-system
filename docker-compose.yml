# Local/staging stack. For real production put a TLS-terminating proxy in front
# (and set DJANGO_SECURE_SSL=True).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://farm:${POSTGRES_PASSWORD:-farm}@db:5432/farm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
